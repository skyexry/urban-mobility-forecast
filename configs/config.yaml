model:
  num_nodes: 100
  in_channels: 2
  hidden_channels: 64
  out_channels: 1
  kernel_size: 3
  K: 3                  # Chebyshev polynomial order for graph conv

training:
  learning_rate: 0.001
  batch_size: 32
  epochs: 100

data:
  input_window: 72      # number of historical time steps (72h = 3 days)
  output_window: 72     # number of future time steps to predict

graph:
  sigma2: 0.0005
  theta: 0.90